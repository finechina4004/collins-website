<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">An afternoon, arranged</title><desc id="desc">An illustrative Collins backyard study: a rectangular blue pool and spa, limestone terrace, striped loungers, a timber pergola, outdoor kitchen and circular fire gathering. A concept drawing, not a completed project or construction plan.</desc>

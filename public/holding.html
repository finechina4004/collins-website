<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Collins Custom Pools & Backyards. Custom pools, spas, and complete backyard projects in Denton County and North Texas. Our new website is in preparation.">
    <meta name="theme-color" content="#f5efdf">
    <title>Collins Custom Pools & Backyards | Website Preview</title>
    <style>
      :root { color-scheme: light; --cream: #f5efdf; --ink: #244c53; --red: #a54738; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--cream); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
      main { min-height: 100svh; display: grid; place-items: center; padding: clamp(16px, 5vw, 64px); }
      .card { width: min(100%, 1040px); border: 1px solid var(--ink); padding: clamp(24px, 6vw, 72px); text-align: center; position: relative; }
      .card::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--ink); pointer-events: none; opacity: .35; }
      .preview { margin: 0 0 44px; color: var(--red); font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
      .brand { margin: 0; font-size: clamp(36px, 8vw, 72px); font-weight: 800; letter-spacing: .09em; line-height: 1.1; }
      .descriptor { margin: 10px 0 0; font-size: clamp(10px, 2.4vw, 13px); letter-spacing: .13em; line-height: 1.7; text-transform: uppercase; }
      .water { display: block; width: min(100%, 320px); height: 36px; margin: 38px auto; color: var(--ink); }
      h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(33px, 6.4vw, 62px); font-weight: 400; line-height: 1.12; letter-spacing: -.04em; text-wrap: balance; }
      .intro { max-width: 460px; margin: 24px auto 0; font-size: clamp(15px, 2.5vw, 17px); line-height: 1.75; text-wrap: pretty; }
      .footnote { margin: 46px 0 0; font-size: 11px; line-height: 1.6; letter-spacing: .14em; text-transform: uppercase; }
      @media (max-width: 380px) { .brand { font-size: 32px; letter-spacing: .06em; } .preview { margin-bottom: 32px; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <p class="preview">Site preview · 002</p>
        <p class="brand">COLLINS</p>
        <p class="descriptor">Custom Pools &amp; Backyards</p>
        <svg class="water" viewBox="0 0 320 36" fill="none" aria-hidden="true" focusable="false">
          <path d="M0 8 Q10 0 20 8 T40 8 T60 8 T80 8 T100 8 T120 8 T140 8 T160 8 T180 8 T200 8 T220 8 T240 8 T260 8 T280 8 T300 8 T320 8 M0 24 Q10 16 20 24 T40 24 T60 24 T80 24 T100 24 T120 24 T140 24 T160 24 T180 24 T200 24 T220 24 T240 24 T260 24 T280 24 T300 24 T320 24" stroke="currentColor" stroke-width="1"/>
        </svg>
        <h1 id="page-title">A new view is<br>on the horizon.</h1>
        <p class="intro">Custom pools, spas, and complete backyard projects in Denton County and surrounding North Texas communities.</p>
        <p class="footnote">Our new website is in preparation.</p>
      </section>
    </main>
  </body>
</html>
